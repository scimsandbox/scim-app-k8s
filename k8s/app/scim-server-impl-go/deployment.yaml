apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-server-impl
  labels:
    app.kubernetes.io/name: scim-server-impl
    app.kubernetes.io/component: scim-server-impl-go
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scim-server-impl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-server-impl
        app.kubernetes.io/component: scim-server-impl-go
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: NotIn
                    values:
                      - database
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:18.1-standard-trixie
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: scim-server-db
          command:
            - /bin/sh
            - -ec
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -d "$POSTGRES_DATABASE"; do echo waiting for postgres; sleep 2; done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: flyway-migrate
          image: edipal/scim-server-db:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: scim-server-db
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DATABASE)"
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: scim-postgres-server-auth
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scim-postgres-server-auth
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: scim-server-impl
          image: edipal/scim-server-impl-go:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: scim-server-impl-go
            - configMapRef:
                name: scim-server-db
          env:
            - name: GO_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DATABASE)"
            - name: GO_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scim-postgres-server-auth
                  key: username
            - name: GO_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scim-postgres-server-auth
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 1000m
              ephemeral-storage: 256Mi
              memory: 1Gi
            limits:
              cpu: 2000m
              ephemeral-storage: 1Gi
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL