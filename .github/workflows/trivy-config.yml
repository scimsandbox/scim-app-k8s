name: Trivy Config Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-config:
    uses: scimsandbox/.github/.github/workflows/reusable-trivy-config.yml@645f5fafbdfccdaf904de1b5f3dc832b2c12cfd9 # v1.1.0
    with:
      scan-ref: "k8s"
      trivyignores: ".trivyignore"
